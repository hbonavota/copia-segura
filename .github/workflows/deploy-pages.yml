name: Deploy a GitHub Pages

# Publica en Pages (ADR-0006) exactamente el commit que CI acaba de validar en un push a `main`.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Solo pushes a main en verde: un PR desde un fork con una rama llamada `main` no despliega.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # El commit que validó CI, no el último de la rama.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Pages dice dónde vive la app (ADR-0008): en la raíz con dominio propio
      # (copia-segura.orbytia.es) o bajo /<repositorio>/ sin él. El build se adapta solo.
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Los permisos de publicación, solo en el job que publica.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
